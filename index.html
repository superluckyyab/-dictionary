<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lexicon — A Reader's Wordbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f3ecdd;
    --page: #faf6ec;
    --page-2: #f6f0e2;
    --ink: #211c15;
    --ink-soft: #5f574a;
    --ink-faint: #8c8475;
    --accent: #8c2f28;
    --accent-soft: #b14a3f;
    --line: #ddd2bd;
    --line-soft: #e8dfcd;
    --gold: #b08431;

    --lvl-a1: #4f8a55;
    --lvl-a2: #6f9b49;
    --lvl-b1: #c08a2e;
    --lvl-b2: #bd6f2a;
    --lvl-c1: #a14424;
    --lvl-c2: #7d2c2c;

    --serif-display: "Newsreader", Georgia, serif;
    --serif-body: "Spectral", Georgia, serif;

    --shadow: 0 1px 2px rgba(40,30,15,0.04), 0 8px 28px -18px rgba(40,30,15,0.30);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background-image:
      radial-gradient(circle at 18% 12%, rgba(176,132,49,0.05), transparent 42%),
      radial-gradient(circle at 88% 78%, rgba(140,47,40,0.04), transparent 45%);
  }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  input, textarea, select { font-family: inherit; }
  ::selection { background: rgba(140,47,40,0.18); }

  /* scrollbars */
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-thumb { background: #cfc3a9; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: #b8aa8a; background-clip: content-box; }

  #root { min-height: 100vh; }

  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes entryIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes panelIn {
    from { transform: translateX(24px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; transition: padding-right .32s cubic-bezier(.4,0,.2,1); }
  .app.reader-open { padding-right: 0; }
  @media (min-width: 1040px) {
    .app.reader-open { padding-right: 480px; }
  }
  .shell { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 24px 120px; }
  @media (max-width: 560px) { .shell { padding: 0 16px 120px; } }

  /* ---------- Masthead ---------- */
  .masthead { padding: 40px 0 18px; }
  .crest { display: flex; align-items: baseline; gap: 12px; }
  .crest h1 {
    font-family: var(--serif-display); font-weight: 500; font-size: 40px;
    letter-spacing: -0.01em; margin: 0; line-height: 1;
  }
  .crest .crest-rule { flex: 1; height: 1px; background: var(--line); align-self: center; }
  .crest .crest-meta { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .tagline { font-style: italic; color: var(--ink-soft); margin: 10px 0 0; font-size: 16px; }

  /* ---------- Search ---------- */
  .searchbar { position: relative; margin-top: 22px; }
  .searchbar input {
    width: 100%; border: 1px solid var(--line); background: var(--page);
    border-radius: 2px; padding: 14px 44px 14px 44px; font-size: 17px; color: var(--ink);
    outline: none; transition: border-color .18s, box-shadow .18s; font-family: var(--serif-body);
  }
  .searchbar input:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(140,47,40,.10); }
  .searchbar input::placeholder { color: var(--ink-faint); font-style: italic; }
  .searchbar .s-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
  .searchbar .s-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--ink-faint); padding: 6px; border-radius: 50%; line-height: 0; }
  .searchbar .s-clear:hover { color: var(--accent); background: var(--page-2); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab {
    border: none; background: none; padding: 11px 4px; margin-right: 22px; font-size: 15px;
    color: var(--ink-faint); position: relative; font-family: var(--serif-body); letter-spacing: .01em;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); }
  .tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
  .tab .pill { font-size: 11px; background: var(--page-2); border: 1px solid var(--line); color: var(--ink-soft); border-radius: 20px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .tab.active .pill { background: rgba(140,47,40,.10); border-color: rgba(140,47,40,.25); color: var(--accent); }

  /* ---------- Level filter ---------- */
  .levelrow { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin: 20px 0 4px; }
  .levelrow .lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-right: 4px; }
  .lvl-chip {
    border: 1px solid var(--line); background: var(--page); border-radius: 2px; padding: 4px 10px;
    font-size: 13px; letter-spacing: .04em; color: var(--ink-soft); transition: all .15s; font-weight: 500;
  }
  .lvl-chip:hover { border-color: var(--ink-faint); }
  .lvl-chip.on { color: #fff; border-color: transparent; }

  /* ---------- Entry list ---------- */
  .count-note { font-size: 13.5px; color: var(--ink-faint); font-style: italic; margin: 22px 0 6px; }
  .list-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
  .list-bar .count-note { margin: 18px 0 6px; }
  .clear-all {
    border: 1px solid var(--line); background: var(--page); border-radius: 2px; padding: 6px 12px;
    font-size: 13px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px;
    transition: all .15s; font-family: var(--serif-body); flex-shrink: 0; white-space: nowrap;
  }
  .clear-all:hover { border-color: var(--accent); color: var(--accent); background: rgba(140,47,40,.05); }
  .entries { border-top: 1px solid var(--line); }
  .load-more { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 20px 0 36px; font-size: 13px; font-style: italic; color: var(--ink-faint); }
  .entry {
    border-bottom: 1px solid var(--line-soft); padding: 10px 2px;
  }
  .entry-head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .entry-headword-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entry-headword {
    font-family: var(--serif-display); font-weight: 500; font-size: 21px; line-height: 1.15;
    color: var(--ink); display: inline-flex; align-items: baseline; gap: 9px;
  }
  .entry-headword .chev { font-size: 13px; color: var(--ink-faint); transition: transform .22s; }
  .entry.open .entry-headword .chev { transform: rotate(90deg); }
  .entry-pos { font-style: italic; color: var(--ink-soft); font-size: 14px; }
  .entry-pos .dot { color: var(--line); margin: 0 7px; }
  .entry-pos .collected-note { color: var(--accent); font-style: normal; font-size: 13px; letter-spacing: .02em; }

  .entry-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .iconbtn {
    border: 1px solid var(--line); background: var(--page); width: 34px; height: 34px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft);
    transition: all .15s; flex-shrink: 0; position: relative;
  }
  .iconbtn:hover { border-color: var(--accent-soft); color: var(--accent); background: #fff; }
  .iconbtn.playing { color: var(--accent); border-color: var(--accent-soft); }
  .iconbtn.faved { color: var(--accent); border-color: rgba(140,47,40,.4); background: rgba(140,47,40,.06); }
  .fav-count {
    position: absolute; top: -6px; right: -6px; background: var(--accent); color: #fff;
    font-size: 11px; min-width: 18px; height: 18px; border-radius: 10px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
    font-family: var(--serif-body); box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }

  /* CEFR badge */
  .cefr { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; color: #fff; border-radius: 2px; padding: 3px 7px; line-height: 1; align-self: center; font-family: var(--serif-body); }

  /* ---------- Entry body (collapsible) ---------- */
  /* grid-template-rows 0fr->1fr is NOT transitioned (transitioning it pins the
     row at 0px in some Chromium builds). The reveal is an instant, reliable
     layout snap — no opacity/transform animation, so content is ALWAYS visible
     when open regardless of frame throttling. */
  .entry-body { display: grid; grid-template-rows: 0fr; }
  .entry.open .entry-body { grid-template-rows: 1fr; }
  .entry-body-inner-wrap { overflow: hidden; min-height: 0; }
  .entry-body-inner { padding: 4px 0 6px 0; }
  .definition { font-size: 17px; line-height: 1.62; color: var(--ink); margin: 8px 0 0; max-width: 60ch; }
  .definition .lead { color: var(--accent); font-weight: 600; }
  .nodef { font-style: italic; color: var(--ink-faint); font-size: 15.5px; margin: 8px 0 0; }

  .ai-note {
    margin: 14px 0 2px; padding: 14px 16px; background: var(--page-2); border-left: 2px solid var(--gold);
    border-radius: 1px; animation: fadeIn .3s ease;
  }
  .ai-note .ai-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .ai-note p { margin: 0; font-size: 15.5px; line-height: 1.58; color: var(--ink); }
  .ai-note .ex { font-style: italic; color: var(--ink-soft); margin-top: 7px; }

  .entry-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  .txtbtn {
    border: 1px solid var(--line); background: var(--page); border-radius: 2px; padding: 7px 13px;
    font-size: 13.5px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px;
    transition: all .15s; font-family: var(--serif-body);
  }
  .txtbtn:hover { border-color: var(--accent-soft); color: var(--accent); }
  .txtbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .txtbtn.primary:hover { background: var(--accent-soft); }
  .txtbtn:disabled { opacity: .55; cursor: default; }
  .txtbtn .recollect { color: var(--ink-faint); }

  /* ---------- Forms (Add / Import) ---------- */
  .panel-card { background: var(--page); border: 1px solid var(--line); border-radius: 3px; padding: 26px 26px 28px; margin-top: 26px; box-shadow: var(--shadow); }
  .panel-card h2 { font-family: var(--serif-display); font-weight: 500; font-size: 24px; margin: 0 0 4px; }
  .panel-card .sub { color: var(--ink-soft); font-style: italic; margin: 0 0 22px; font-size: 15px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--line); background: var(--page-2); border-radius: 2px;
    padding: 11px 12px; font-size: 15.5px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(140,47,40,.08); background: var(--page); }
  .field textarea { resize: vertical; min-height: 90px; line-height: 1.5; font-family: var(--serif-body); }
  .field.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .field.row2 { grid-template-columns: 1fr; } }
  .lvl-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .lvl-picker button { flex: 1; min-width: 52px; border: 1px solid var(--line); background: var(--page-2); padding: 9px 0; border-radius: 2px; font-weight: 600; letter-spacing: .04em; color: var(--ink-soft); transition: all .15s; }
  .lvl-picker button.on { color: #fff; border-color: transparent; }
  .form-actions { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
  .import-csv { width: 100%; min-height: 200px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.65; white-space: pre; }
  .import-hint { font-size: 13px; color: var(--ink-faint); margin: 10px 0 0; line-height: 1.6; }
  .import-hint code { background: var(--page-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 2px; font-size: 12px; }
  .filebtn { border: 1px dashed var(--line); background: var(--page-2); border-radius: 2px; padding: 10px 14px; color: var(--ink-soft); font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
  .filebtn:hover { border-color: var(--accent-soft); color: var(--accent); }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 12px 20px; border-radius: 3px; font-size: 14.5px; box-shadow: 0 10px 30px -8px rgba(0,0,0,.4); z-index: 200; animation: fadeIn .2s ease; }

  /* ---------- Empty state ---------- */
  .empty { text-align: center; padding: 70px 20px; color: var(--ink-faint); }
  .empty .glyph { font-family: var(--serif-display); font-size: 52px; color: var(--line); }
  .empty p { font-style: italic; margin: 14px 0 0; font-size: 16px; }

  /* ---------- Reader (Oxford) panel ---------- */
  .reader-overlay { position: fixed; inset: 0; background: rgba(33,28,21,.42); z-index: 90; animation: fadeIn .2s ease; }
  @media (min-width: 1040px) { .reader-overlay { display: none; } }
  .reader {
    position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw; background: var(--page);
    border-left: 1px solid var(--line); z-index: 100; display: flex; flex-direction: column;
    box-shadow: -18px 0 40px -24px rgba(40,30,15,.4); animation: panelIn .3s cubic-bezier(.4,0,.2,1);
  }
  @media (max-width: 1039px) { .reader { width: 460px; } }
  @media (max-width: 520px) { .reader { width: 100vw; } }
  .reader-top { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .reader-top .rt-word { font-family: var(--serif-display); font-size: 21px; font-weight: 500; flex: 1; min-width: 0; }
  .reader-top .rt-word span { color: var(--ink-faint); font-style: italic; font-size: 14px; margin-left: 8px; }

  .reader-scroll { flex: 1; overflow-y: auto; }

  /* hero */
  .reader-hero { padding: 26px 24px 20px; border-bottom: 1px solid var(--line-soft); background: linear-gradient(180deg, var(--page-2), var(--page)); }
  .rh-row { display: flex; align-items: center; gap: 14px; }
  .rh-word { font-family: var(--serif-display); font-weight: 500; font-size: 38px; line-height: 1; margin: 0; flex: 1; min-width: 0; }
  .rh-pos { font-style: italic; color: var(--ink-soft); font-size: 16px; margin-top: 7px; }
  .rh-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .reader-say, .reader-collect {
    border: 1px solid var(--line); background: var(--page); border-radius: 2px; padding: 9px 15px;
    font-size: 14.5px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 8px;
    transition: all .15s; font-family: var(--serif-body);
  }
  .reader-say { background: var(--accent); border-color: var(--accent); color: #fff; }
  .reader-say:hover { background: var(--accent-soft); }
  .reader-say.playing { background: var(--accent-soft); }
  .reader-collect:hover { border-color: var(--accent-soft); color: var(--accent); }
  .reader-collect.on { border-color: rgba(140,47,40,.4); color: var(--accent); background: rgba(140,47,40,.06); }
  .rh-subactions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* sections */
  .reader-sec { padding: 20px 24px; border-bottom: 1px solid var(--line-soft); }
  .rs-label { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .rs-def { font-size: 17.5px; line-height: 1.62; color: var(--ink); margin: 0; max-width: 46ch; }
  .rs-empty { font-style: italic; color: var(--ink-faint); font-size: 15px; margin: 0; line-height: 1.55; }
  .rs-loading { display: flex; align-items: center; gap: 9px; color: var(--gold); font-style: italic; font-size: 15px; }
  .rs-ai-simple { font-size: 16.5px; line-height: 1.58; color: var(--ink); margin: 0; }
  .rs-ai-line { margin: 0 0 13px; }
  .rs-ai-line:last-of-type { margin-bottom: 4px; }
  .rs-ai-key { display: inline-block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 3px; }
  .rs-ai-val { margin: 0; font-size: 16.5px; line-height: 1.56; color: var(--ink); }
  .rs-ai-ex { font-style: italic; color: var(--ink-soft); font-size: 15.5px; }
  .rs-ai-tip { font-size: 15px; color: var(--ink-soft); }
  .rs-syn { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 14px 0 4px; }
  .rs-syn-lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-right: 2px; }
  .syn-chip { font-size: 13.5px; background: var(--page-2); border: 1px solid var(--line); color: var(--ink-soft); border-radius: 20px; padding: 3px 11px; }
  .rs-oxford-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* embed */
  .reader-frame-wrap { position: relative; background: #fff; height: 420px; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .reader-frame-wrap iframe { width: 100%; height: 100%; border: 0; }
  .frame-x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--page); color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; }
  .frame-x:hover { color: var(--accent); border-color: var(--accent-soft); }

  /* active row */
  .entry.active { background: linear-gradient(90deg, rgba(140,47,40,.06), transparent 80%); margin: 0 -10px; padding-left: 12px; padding-right: 12px; border-radius: 2px; }
  .entry.active .entry-headword { color: var(--accent); }
  .entry.active .chev { transform: rotate(90deg); color: var(--accent); }
  .chev { transition: transform .2s; }

  /* selection lookup popover */
  .reader-scroll { -webkit-user-select: text; user-select: text; }
  .wtok {
    cursor: pointer; border-radius: 3px; padding: 0 1px; margin: 0 -1px;
    transition: background .12s ease, color .12s ease, box-shadow .12s ease;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
  }
  .wtok:hover { background: rgba(140,47,40,.13); color: var(--accent); text-decoration-color: rgba(140,47,40,.4); }
  .wtok:active { background: rgba(140,47,40,.22); }
  .lookup-pop {
    position: fixed; z-index: 130; width: 232px; background: var(--page); border: 1px solid var(--line);
    border-radius: 4px; box-shadow: 0 14px 36px -12px rgba(40,30,15,.45); padding: 12px 13px 13px;
    animation: fadeIn .12s ease;
  }
  .lp-word { font-family: var(--serif-display); font-size: 19px; font-weight: 500; color: var(--ink); display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
  .lp-status { font-family: var(--serif-body); font-size: 11.5px; font-style: italic; letter-spacing: .02em; color: var(--ink-faint); }
  .lp-status.in { color: var(--lvl-a1); }
  .lp-actions { display: flex; gap: 7px; }
  .lp-actions .txtbtn { flex: 1; justify-content: center; padding: 8px 10px; font-size: 13px; white-space: nowrap; }
  .reader-tip { font-size: 12px; color: var(--ink-faint); font-style: italic; padding: 9px 24px; background: var(--page-2); border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 7px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
