<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lexicon — A Reader's Wordbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f3ecdd;
    --page: #faf6ec;
    --page-2: #f6f0e2;
    --ink: #211c15;
    --ink-soft: #5f574a;
    --ink-faint: #8c8475;
    --accent: #8c2f28;
    --accent-soft: #b14a3f;
    --line: #ddd2bd;
    --line-soft: #e8dfcd;
    --gold: #b08431;

    --lvl-a1: #4f8a55;
    --lvl-a2: #6f9b49;
    --lvl-b1: #c08a2e;
    --lvl-b2: #bd6f2a;
    --lvl-c1: #a14424;
    --lvl-c2: #7d2c2c;

    --serif-display: "Newsreader", Georgia, serif;
    --serif-body: "Spectral", Georgia, serif;

    --shadow: 0 1px 2px rgba(40,30,15,0.04), 0 8px 28px -18px rgba(40,30,15,0.30);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background-image:
      radial-gradient(circle at 18% 12%, rgba(176,132,49,0.05), transparent 42%),
      radial-gradient(circle at 88% 78%, rgba(140,47,40,0.04), transparent 45%);
  }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  input, textarea, select { font-family: inherit; }
  ::selection { background: rgba(140,47,40,0.18); }

  /* scrollbars */
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-thumb { background: #cfc3a9; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: #b8aa8a; background-clip: content-box; }

  #root { min-height: 100vh; }

  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes entryIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes panelIn {
    from { transform: translateX(24px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; transition: padding-right .32s cubic-bezier(.4,0,.2,1); }
  .app.reader-open { padding-right: 0; }
  @media (min-width: 1040px) {
    .app.reader-open { padding-right: 480px; }
  }
  .shell { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 24px 120px; }
  @media (max-width: 560px) { .shell { padding: 0 16px 120px; } }

  /* ---------- Masthead ---------- */
  .masthead { padding: 24px 0 8px; }
  .crest { display: flex; align-items: baseline; gap: 12px; }
  .crest h1 {
    font-family: var(--serif-display); font-weight: 500; font-size: 40px;
    letter-spacing: -0.01em; margin: 0; line-height: 1;
  }
  .crest .crest-rule { flex: 1; height: 1px; background: var(--line); align-self: center; }
  .crest .crest-meta { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .tagline { font-style: italic; color: var(--ink-soft); margin: 10px 0 0; font-size: 16px; }

  /* ---------- Search ---------- */
  .searchbar { position: relative; margin-top: 22px; }
  .searchbar input {
    width: 100%; border: 1px solid var(--line); background: var(--page);
    border-radius: 2px; padding: 14px 44px 14px 44px; font-size: 17px; color: var(--ink);
    outline: none; transition: border-color .18s, box-shadow .18s; font-family: var(--serif-body);
  }
  .searchbar input:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(140,47,40,.10); }
  .searchbar input::placeholder { color: var(--ink-faint); font-style: italic; }
  .searchbar .s-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
  .searchbar .s-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--ink-faint); padding: 6px; border-radius: 50%; line-height: 0; }
  .searchbar .s-clear:hover { color: var(--accent); background: var(--page-2); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab {
    border: none; background: none; padding: 11px 4px; margin-right: 22px; font-size: 15px;
    color: var(--ink-faint); position: relative; font-family: var(--serif-body); letter-spacing: .01em;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); }
  .tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
  .tab .pill { font-size: 11px; background: var(--page-2); border: 1px solid var(--line); color: var(--ink-soft); border-radius: 20px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .tab.active .pill { background: rgba(140,47,40,.10); border-color: rgba(140,47,40,.25); color: var(--accent); }

  /* icon-only tab bar — label shows on hover */
  .icontabs { gap: 1px; align-items: stretch; }
  .icontabs .tab { margin-right: 0; padding: 9px 12px; gap: 5px; border-radius: 5px 5px 0 0; }
  .icontabs .tab:hover { background: var(--page-2); color: var(--ink); }
  .icontabs .tab.active { background: rgba(140,47,40,.06); color: var(--accent); }
  .icontabs .tab-ico { display: inline-flex; align-items: center; line-height: 0; }
  .icontabs .tab-label {
    position: absolute; top: calc(100% + 7px); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--page); font-size: 12px; line-height: 1; padding: 6px 9px;
    border-radius: 3px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .14s ease;
    z-index: 60; letter-spacing: .02em; box-shadow: 0 6px 18px -6px rgba(0,0,0,.4);
  }
  .icontabs .tab-label::before { content: ""; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-bottom-color: var(--ink); }
  .icontabs .tab:hover .tab-label { opacity: 1; }
  .tab-sep { width: 1px; background: var(--line); margin: 8px 9px; align-self: center; height: 18px; }

  /* ---------- Level filter ---------- */
  .levelrow { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin: 20px 0 4px; }
  .levelrow .lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-right: 4px; }
  .lvl-chip {
    border: 1px solid var(--line); background: var(--page); border-radius: 2px; padding: 4px 10px;
    font-size: 13px; letter-spacing: .04em; color: var(--ink-soft); transition: all .15s; font-weight: 500;
  }
  .lvl-chip:hover { border-color: var(--ink-faint); }
  .lvl-chip.on { color: #fff; border-color: transparent; }

  /* ---------- A–Z letter filter ---------- */
  .letterrow { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 12px 0 4px; }
  .ltr-chip {
    border: 1px solid var(--line); background: var(--page); border-radius: 2px;
    min-width: 28px; height: 28px; padding: 0 5px; font-size: 13px; font-weight: 500;
    color: var(--ink-soft); transition: all .13s; font-family: var(--serif-body);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ltr-chip:hover { border-color: var(--accent-soft); color: var(--accent); }
  .ltr-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ltr-all { letter-spacing: .04em; padding: 0 9px; }

  /* ---------- Entry list ---------- */
  .count-note { font-size: 13.5px; color: var(--ink-faint); font-style: italic; margin: 22px 0 6px; }
  .list-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
  .list-bar .count-note { margin: 18px 0 6px; }
  .clear-all {
    border: 1px solid var(--line); background: var(--page); border-radius: 2px; padding: 6px 12px;
    font-size: 13px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px;
    transition: all .15s; font-family: var(--serif-body); flex-shrink: 0; white-space: nowrap;
  }
  .clear-all:hover { border-color: var(--accent); color: var(--accent); background: rgba(140,47,40,.05); }

  /* definitions display mode */
  .defmode { display: inline-flex; align-items: center; gap: 9px; flex-shrink: 0; }
  .dm-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .dm-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .dm-seg button { border: none; background: var(--page); padding: 6px 11px; font-size: 13px; color: var(--ink-soft); font-family: var(--serif-body); }
  .dm-seg button + button { border-left: 1px solid var(--line); }
  .dm-seg button:hover { color: var(--accent); }
  .dm-seg button.on { background: var(--accent); color: #fff; }

  /* inline definition reveal + detail */
  .entry-reveal { padding: 2px 2px 8px; }
  .entry-def-line { display: flex; align-items: baseline; gap: 12px; cursor: pointer; padding: 6px 10px; border-radius: 3px; transition: background .12s; border-left: 2px solid var(--line); }
  .entry-def-line:hover { background: var(--page-2); border-left-color: var(--accent-soft); }
  .entry-def-line.open { background: var(--page-2); border-left-color: var(--accent); }
  .entry-def-text { font-size: 15.5px; line-height: 1.55; color: var(--ink); flex: 1; }
  .entry-def-empty { font-size: 14.5px; font-style: italic; color: var(--ink-faint); flex: 1; }
  .entry-def-cue { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); flex-shrink: 0; }
  .entry-def-line:hover .entry-def-cue, .entry-def-line.open .entry-def-cue { color: var(--accent); }
  .entry-detail { padding: 12px 12px 6px; animation: fadeIn .2s ease; }

  /* manage / batch-delete */
  .manage-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; margin-top: 8px; background: var(--page); border: 1px solid var(--line); border-radius: 3px; }
  .manage-all { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
  .manage-all button { border: none; background: none; font-family: var(--serif-body); font-size: 14px; color: var(--ink-soft); }
  .manage-all button:hover { color: var(--accent); }
  .manage-count { font-size: 13px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .manage-spacer { flex: 1; }
  .manage-del { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 2px; padding: 7px 14px; font-size: 13.5px; font-family: var(--serif-body); display: inline-flex; align-items: center; gap: 7px; transition: all .15s; }
  .manage-del:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent-soft); }
  .manage-del:disabled { opacity: .4; cursor: default; }
  .pickbox { width: 20px; height: 20px; border: 1.5px solid var(--ink-faint); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; transition: all .12s; }
  .pickbox.on { background: var(--accent); border-color: var(--accent); }
  .entry-head .pickbox { margin-right: 12px; align-self: center; }
  .entry.picked { background: rgba(140,47,40,.06); margin: 0 -10px; padding-left: 12px; padding-right: 12px; }
  .entry-head { user-select: none; }

  /* confirm modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(33,28,21,.5); z-index: 220; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn .15s ease; }
  .confirm-box { background: var(--page); border: 1px solid var(--line); border-radius: 5px; max-width: 380px; width: 100%; padding: 28px 26px 22px; text-align: center; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); animation: quizPop .25s cubic-bezier(.34,1.4,.5,1); }
  .confirm-icon { width: 52px; height: 52px; border-radius: 50%; background: rgba(140,47,40,.1); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .confirm-box h3 { font-family: var(--serif-display); font-weight: 500; font-size: 22px; margin: 0 0 8px; }
  .confirm-box p { font-size: 14.5px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 22px; }
  .confirm-actions { display: flex; gap: 10px; justify-content: center; }
  .txtbtn.danger { background: var(--accent); border-color: var(--accent); color: #fff; }
  .txtbtn.danger:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .entries { border-top: 1px solid var(--line); }
  .load-more { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 20px 0 36px; font-size: 13px; font-style: italic; color: var(--ink-faint); }
  .entry {
    border-bottom: 1px solid var(--line-soft); padding: 10px 2px;
  }
  .entry-head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .entry-headword-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entry-headword {
    font-family: var(--serif-display); font-weight: 500; font-size: 21px; line-height: 1.15;
    color: var(--ink); display: inline-flex; align-items: baseline; gap: 9px;
  }
  .entry-headword .chev { font-size: 13px; color: var(--ink-faint); transition: transform .22s; }
  .entry.open .entry-headword .chev { transform: rotate(90deg); }
  .entry-pos { font-style: italic; color: var(--ink-soft); font-size: 14px; }
  .entry-pos .dot { color: var(--line); margin: 0 7px; }
  .entry-pos .collected-note { color: var(--accent); font-style: normal; font-size: 13px; letter-spacing: .02em; }

  .entry-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .iconbtn {
    border: 1px solid var(--line); background: var(--page); width: 34px; height: 34px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft);
    transition: all .15s; flex-shrink: 0; position: relative;
  }
  .iconbtn:hover { border-color: var(--accent-soft); color: var(--accent); background: #fff; }
  .iconbtn.playing { color: var(--accent); border-color: var(--accent-soft); }
  .iconbtn.faved { color: var(--accent); border-color: rgba(140,47,40,.4); background: rgba(140,47,40,.06); }
  .fav-count {
    position: absolute; top: -6px; right: -6px; background: var(--accent); color: #fff;
    font-size: 11px; min-width: 18px; height: 18px; border-radius: 10px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
    font-family: var(--serif-body); box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }

  /* CEFR badge */
  .cefr { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; color: #fff; border-radius: 2px; padding: 3px 7px; line-height: 1; align-self: center; font-family: var(--serif-body); }

  /* Phonics: word "opens up" into syllables on hover */
  .splitword { cursor: help; }
  .syl { transition: color .16s ease; }
  .sylsep {
    display: inline-block; width: 0; overflow: hidden; opacity: 0; color: var(--gold);
    text-align: center; vertical-align: baseline; font-weight: 400;
    transition: width .17s cubic-bezier(.4,0,.2,1), opacity .17s ease;
  }
  .splitword:hover .sylsep { width: .44em; opacity: .85; }
  .splitword:hover .syl-1 { color: var(--accent); }
  .qc-word .splitword:hover .sylsep, .rh-word .splitword:hover .sylsep { width: .5em; }

  /* Know / don't-know toggle */
  .know-switch { position: relative; width: 50px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: #fff; padding: 0; flex-shrink: 0; transition: background .2s ease, border-color .2s ease; cursor: pointer; }
  .know-switch.on { background: var(--lvl-a1); border-color: var(--lvl-a1); }
  .ks-knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(40,30,15,.28); display: flex; align-items: center; justify-content: center; color: var(--ink-faint); transition: left .2s cubic-bezier(.4,0,.2,1), color .2s ease; }
  .know-switch.on .ks-knob { left: 26px; color: var(--lvl-a1); }
  .know-switch:hover { border-color: var(--ink-faint); }
  .know-switch.on:hover { border-color: var(--lvl-a1); filter: brightness(.97); }

  /* row tint by known-status */
  .entry.known-yes .entry-headword { color: var(--lvl-a1); }

  /* review toggle */
  .review-toggle {
    border: 1px solid var(--line); background: var(--page); border-radius: 2px; padding: 6px 13px;
    font-size: 13px; color: var(--ink-soft); transition: all .15s; font-family: var(--serif-body);
    flex-shrink: 0; white-space: nowrap;
  }
  .review-toggle:hover { border-color: var(--accent-soft); color: var(--accent); }
  .review-toggle.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- Quiz ---------- */
  .quiz { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .quiz-settings { display: flex; gap: 24px; row-gap: 12px; flex-wrap: wrap; align-items: center; padding: 14px 16px; background: var(--page); border: 1px solid var(--line); border-radius: 3px; }
  .qs-group { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .qs-group .lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-right: 4px; }
  .size-chip {
    border: 1px solid var(--line); background: var(--page-2); border-radius: 2px; width: 34px; padding: 4px 0;
    font-size: 13.5px; color: var(--ink-soft); transition: all .15s; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .size-chip:hover { border-color: var(--ink-faint); }
  .size-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .quiz-note { font-size: 13.5px; color: var(--ink-faint); font-style: italic; margin: 0; }
  .quiz-card {
    background: var(--page); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: var(--shadow); padding: 24px 24px 22px;
    animation: quizPop .3s cubic-bezier(.34,1.45,.5,1); transform-origin: top center;
  }
  @keyframes quizPop { from { transform: scale(.96) translateY(10px); } to { transform: none; } }
  .qc-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
  .qc-word-wrap { text-align: center; min-width: 0; padding: 0 8px; }
  .qc-index { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
  .qc-word { font-family: var(--serif-display); font-weight: 500; font-size: 40px; line-height: 1.05; overflow-wrap: anywhere; }
  .qc-meta { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 10px; font-style: italic; color: var(--ink-soft); font-size: 15px; }
  .qc-meta .iconbtn { width: 32px; height: 32px; }
  .qc-btn {
    border: 1px solid var(--line); background: var(--page-2); border-radius: 3px;
    padding: 16px 10px; font-size: 15px; font-family: var(--serif-body); color: var(--ink-soft);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .15s; min-height: 56px; white-space: nowrap;
  }
  .qc-yes { justify-self: stretch; }
  .qc-no { justify-self: stretch; }
  .qc-yes:hover { border-color: var(--lvl-a1); color: var(--lvl-a1); background: rgba(79,138,85,.08); }
  .qc-no:hover { border-color: var(--accent); color: var(--accent); background: rgba(140,47,40,.08); }
  .qc-yes.on { background: var(--lvl-a1); border-color: var(--lvl-a1); color: #fff; }
  .qc-no.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qc-reveal { border-top: 1px solid var(--line-soft); margin-top: 20px; padding-top: 16px; }
  .qc-def { font-size: 16.5px; line-height: 1.6; margin: 0 0 10px; color: var(--ink); }
  .qc-meaning { font-size: 16px; line-height: 1.58; margin: 0; color: var(--ink); }
  .qc-meaning::before { content: "In plainer words — "; color: var(--gold); font-style: italic; }
  .qc-ex { font-style: italic; color: var(--ink-soft); margin: 8px 0 0; font-size: 15px; }
  .quiz-foot { display: flex; align-items: center; gap: 14px; padding: 4px 0 30px; }
  .quiz-next { padding: 10px 18px; font-size: 14.5px; }
  .quiz-hint { font-size: 13px; font-style: italic; color: var(--ink-faint); }
  @media (max-width: 620px) {
    .qc-row { grid-template-columns: 1fr 1fr; }
    .qc-word-wrap { grid-column: 1 / -1; grid-row: 1; }
  }

  /* ---------- Entry body (collapsible) ---------- */
  .entry-body { display: grid; grid-template-rows: 0fr; }
  .entry.open .entry-body { grid-template-rows: 1fr; }
  .entry-body-inner-wrap { overflow: hidden; min-height: 0; }
  .entry-body-inner { padding: 4px 0 6px 0; }
  .definition { font-size: 17px; line-height: 1.62; color: var(--ink); margin: 8px 0 0; max-width: 60ch; }
  .definition .lead { color: var(--accent); font-weight: 600; }
